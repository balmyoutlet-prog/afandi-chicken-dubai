name: Jahjah credit clarity
on:
  push:
    paths:
      - '.github/workflows/jahjah-credit-clarity.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch icon metadata and footer credit
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('index.html')
          s = page.read_text()
          icon_line = '<link rel="icon" type="image/x-icon" sizes="32x32" href="/favicon.ico?v=afandi-20260915">\n'
          shortcut = '<link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=afandi-20260916">\n'
          if 'rel="shortcut icon"' not in s:
              if icon_line not in s:
                  raise SystemExit('favicon marker not found')
              s = s.replace(icon_line, icon_line + shortcut, 1)

          old = '<footer class="social-strip" id="afandiPublicFooter" aria-label="Contact Al Afandi Chicken"><a href="mailto:info@alafandichicken.com" dir="ltr">info@alafandichicken.com</a><a href="https://jahjahwebdigital.com/" target="_blank" rel="noopener noreferrer" dir="ltr">Jahjah WebDigital ↗</a></footer>'
          new = '<footer class="social-strip studio-credit" id="afandiPublicFooter" aria-label="Contact Al Afandi Chicken"><a href="mailto:info@alafandichicken.com" dir="ltr">info@alafandichicken.com</a><span class="studio-credit-copy" dir="ltr">Created by <a class="studio-credit-brand" href="https://jahjahwebdigital.com/" target="_blank" rel="noopener noreferrer">Jahjah WebDigital ↗</a> <span aria-hidden="true">·</span> <a class="studio-credit-instagram" href="https://www.instagram.com/jahjah.webdigital.lb/" target="_blank" rel="noopener noreferrer">Instagram ↗</a></span></footer>'
          if 'studio-credit-brand' not in s:
              if old not in s:
                  raise SystemExit('footer marker not found')
              s = s.replace(old, new, 1)
          page.write_text(s)

          css = Path('affandi.css')
          c = css.read_text()
          marker = '/* Jahjah WebDigital attribution */'
          block = '''\n/* Jahjah WebDigital attribution */\n#afandiPublicFooter.studio-credit{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px;padding:16px 18px}\n#afandiPublicFooter .studio-credit-copy{display:inline-flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:7px;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:600;letter-spacing:.02em}\n#afandiPublicFooter .studio-credit-brand{font-weight:800;text-decoration:underline;text-underline-offset:3px}\n#afandiPublicFooter .studio-credit-instagram{opacity:.88;text-decoration:underline;text-underline-offset:3px}\n#afandiPublicFooter .studio-credit-brand:hover,#afandiPublicFooter .studio-credit-instagram:hover{opacity:1}\n'''
          if marker not in c:
              c += block
          css.write_text(c)
          PY
          rm -f .github/workflows/jahjah-credit-clarity.yml
      - name: Commit changes
        run: |
          git config user.name 'Jahjah WebDigital Automation'
          git config user.email 'balmyoutlet@gmail.com'
          git add index.html affandi.css .github/workflows/jahjah-credit-clarity.yml
          git diff --cached --quiet || git commit -m 'Clarify Jahjah attribution and preserve Afandi browser icon'
          git push origin HEAD:main
