name: One-time opening-soon orderability repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/opening-soon-orderability-repair.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm intended owner branch-status change
        run: |
          grep -q "openingSoon:true" app.js
          grep -q "branches.filter(b=>!b.openingSoon)" app.js
      - name: Apply scoped repair patch
        env:
          REPAIR_PATCH_GZ_B64: ""
        run: |
          printf '%s' "$REPAIR_PATCH_GZ_B64" | base64 -d | gunzip > /tmp/opening-soon.patch
          git apply --check /tmp/opening-soon.patch
          git apply /tmp/opening-soon.patch
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium webkit
      - name: Validate locally before creating repair branch
        run: |
          node --check delivery-location.js
          node --check scripts/e2e-reliability.cjs
          node --check scripts/e2e-distance-delivery.cjs
          node --check scripts/e2e-checkout-rails.cjs
          node --test scripts/test-delivery-pricing.cjs
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/afandi-repair-server.log 2>&1 &
          node scripts/e2e-distance-delivery.cjs
          node scripts/e2e-reliability.cjs
          node scripts/e2e-checkout-rails.cjs
      - name: Commit verified repair to isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b repair/opening-soon-orderability-20260924
          git rm .github/workflows/opening-soon-orderability-repair.yml
          git add delivery-location.js scripts/e2e-reliability.cjs scripts/e2e-distance-delivery.cjs scripts/e2e-checkout-rails.cjs
          git commit -m 'fix: keep opening-soon branches out of delivery routing'
          git push origin HEAD:repair/opening-soon-orderability-20260924
