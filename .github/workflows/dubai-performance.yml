name: Afandi Dubai live performance
on:
  push:
    branches: [main, fix/dubai-checkout-reliability-20260915]
    paths: ['.github/workflows/dubai-performance.yml', 'index.html', 'app.js', 'reliability.js']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: afandi-performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install browser audit dependency
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Measure actual public HTTPS page (no orders sent)
        run: |
          mkdir -p audit-results
          cat > /tmp/unused <<'TXT'
          Performance samples are synthetic measurements, not Lighthouse scores or field INP.
          TXT
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const url='https://alafandichicken.com';
            const browser=await chromium.launch({channel:'chrome',headless:true});
            const results={url,actualMessagesSent:0,gitCommit:process.env.GITHUB_SHA,samples:[]};
            for(const mode of ['unthrottled','slow-4g']){
              const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
              await context.route('**/_vercel/**',r=>r.abort());
              await context.route('https://wa.me/**',r=>r.abort());
              const page=await context.newPage();
              const errors=[],badResponses=[],insecure=[];
              page.on('pageerror',e=>errors.push(e.message));
              page.on('response',r=>{if(r.status()>=400)badResponses.push({url:r.url(),status:r.status()})});
              page.on('request',r=>{if(r.url().startsWith('http:'))insecure.push(r.url())});
              await page.addInitScript(()=>{
                localStorage.setItem('affandi-lang-v2','en');
                window.__metrics={lcpMs:0,cls:0,longTaskBlockingMs:0};
                try{new PerformanceObserver(list=>{for(const e of list.getEntries())window.__metrics.lcpMs=e.startTime}).observe({type:'largest-contentful-paint',buffered:true})}catch(_){}
                try{new PerformanceObserver(list=>{for(const e of list.getEntries())if(!e.hadRecentInput)window.__metrics.cls+=e.value}).observe({type:'layout-shift',buffered:true})}catch(_){}
                try{new PerformanceObserver(list=>{for(const e of list.getEntries())window.__metrics.longTaskBlockingMs+=Math.max(0,e.duration-50)}).observe({type:'longtask',buffered:true})}catch(_){}
              });
              const cdp=await context.newCDPSession(page);
              await cdp.send('Network.enable');
              await cdp.send('Network.setCacheDisabled',{cacheDisabled:true});
              if(mode==='slow-4g'){
                await cdp.send('Network.emulateNetworkConditions',{offline:false,latency:150,downloadThroughput:200000,uploadThroughput:93750,connectionType:'cellular4g'});
                await cdp.send('Emulation.setCPUThrottlingRate',{rate:4});
              }
              const response=await page.goto(url,{waitUntil:'load',timeout:45000});
              await page.waitForTimeout(2500);
              const sample=await page.evaluate(()=>{
                const n=performance.getEntriesByType('navigation')[0];
                const paint=performance.getEntriesByName('first-contentful-paint')[0];
                return {status:document.readyState,release:!!document.querySelector('script[src*="reliability.js"]'),products:document.querySelectorAll('#menuGrid .menu-card').length,ttfbMs:n.responseStart-n.requestStart,domReadyMs:n.domContentLoadedEventEnd,loadMs:n.loadEventEnd,fcpMs:paint?.startTime,...window.__metrics,viewportOverflow:document.documentElement.scrollWidth>innerWidth,initialLoadedImages:Array.from(document.images).filter(i=>i.complete&&i.naturalWidth>0).length,resources:performance.getEntriesByType('resource').map(r=>({url:r.name,bytes:r.transferSize,durationMs:r.duration}))};
              });
              results.samples.push({mode,httpStatus:response.status(),cpuSlowdown:mode==='slow-4g'?4:1,...sample,errors,badResponses,insecure});
              await page.screenshot({path:`audit-results/mobile-${mode}.png`,fullPage:false});
              await context.close();
            }
            await browser.close();
            fs.writeFileSync('audit-results/performance.json',JSON.stringify(results,null,2));
            console.log(JSON.stringify(results,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: afandi-dubai-performance-${{ github.run_id }}
          path: audit-results/
          retention-days: 7
