name: Afandi admin and client regression
on:
  push:
    branches: [codex/afandi-admin-analytics]
    paths: [admin/**, afandi-client.js, afandi-client.css, tests/regression.cjs, scripts/admin-integrate.py, .github/workflows/admin-regression.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: afandi-admin-regression
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/afandi-admin-analytics
          fetch-depth: 0
      - name: Integrate with current source and preserve current menu
        run: |
          python scripts/admin-integrate.py
          node --check app.js
          node --check afandi-client.js
          node --check admin/admin.js
          node build.mjs
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Test without any live orders, messages, or analytics events
        run: node tests/regression.cjs
      - name: Commit tested integration only to the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html vercel.json backend/catalog.json
          git diff --cached --quiet || git commit -m 'feat: integrate tested restaurant admin API and truthful measurement'
          git push origin HEAD:codex/afandi-admin-analytics
      - name: Save browser evidence and tested source
        if: always()
        run: |
          mkdir -p audit-results
          tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=audit-results -czf /tmp/admin-tested-source.tar.gz .
          cp /tmp/admin-tested-source.tar.gz audit-results/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: afandi-admin-regression
          path: audit-results/
          retention-days: 7
