name: Afandi admin and client regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build and test only; never provision users or publish
        run: |
          node build.mjs
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit
          node tests/regression.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: afandi-admin-regression
          path: audit-results/
          retention-days: 7
