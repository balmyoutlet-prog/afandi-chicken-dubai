name: Afandi delivery distance
on:
  push:
    branches: [feat/distance-delivery-20260915]
    paths: ['.github/workflows/delivery-distance.yml', 'delivery-pricing.js', 'scripts/test-delivery-pricing.cjs']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify tariff boundaries, zero-fee pickup and incomplete-location safety
        run: |
          mkdir -p audit-results
          node --check delivery-pricing.js
          node --test scripts/test-delivery-pricing.cjs | tee audit-results/pricing-tests.txt
      - name: Confirm pricing is staged only, not activated in checkout
        run: |
          python - <<'PY'
          from pathlib import Path
          assert 'delivery-pricing.js' not in Path('index.html').read_text(), 'Unexpected live integration before branch pin verification'
          print('Staged pricing only. No DNS, email, live delivery fee or live checkout changes.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: afandi-delivery-pricing-tests
          path: audit-results/
          retention-days: 7
