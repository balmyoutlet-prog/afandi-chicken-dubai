name: Sync current source for admin integration
on:
  push:
    branches: [codex/afandi-admin-analytics]
    paths: [.github/workflows/admin-source-sync.yml]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/afandi-admin-analytics
      - name: Preserve all concurrent production improvements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:codex/afandi-admin-analytics
          git archive --format=tar.gz HEAD > /tmp/afandi-current-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: afandi-current-source
          path: /tmp/afandi-current-source.tar.gz
          retention-days: 7
